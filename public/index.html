<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Event Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css on
       every image build, so the stylesheet is regenerated from THIS commit's
       markup every deploy. Class names must be whole literals — a class
       assembled from fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Never vendor it and never write a hostname in front of it. It is NOT
       conditional on this app calling a bridge API: it is also how the app
       ANSWERS the shell (offline launch included), and it forwards the
       viewer's theme and safe-area insets below. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script>
    // Theme: the viewer picks Light, Dark or System in the platform's own
    // settings. prefers-color-scheme inside this frame cannot see that
    // choice, so read the bridge's forwarded value, with the OS preference
    // as the standalone fallback.
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme)
          || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen antialiased">
  <main id="app" class="max-w-md mx-auto px-4 py-6"></main>

  <script>
    // ------------------------------------------------------------------
    // Event Board — event list, event detail with Going, create event.
    // ------------------------------------------------------------------
    const appEl = document.getElementById('app');

    // The iframe URL carries the platform token on load. Capture it once:
    // later pushState navigation changes the URL but not the identity.
    const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
    const HEADERS = Object.assign({ 'Content-Type': 'application/json' },
      TOKEN ? { 'x-usernode-token': TOKEN } : {});

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function api(path, opts) {
      const res = await fetch(path, Object.assign({}, opts, { headers: HEADERS }));
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    // One Going state tint reused by cards and the toggle button.
    const GOING_PILL = 'rounded-full bg-violet-100 dark:bg-violet-600/20 text-violet-700 dark:text-violet-300';
    const CARD = 'rounded-2xl bg-white dark:bg-zinc-900 shadow-sm border border-zinc-200 dark:border-zinc-800';

    // ------------------------------------------------------------------
    // Navigation: clean paths (/new, /event/<id>) with pushState.
    // ------------------------------------------------------------------
    function navigate(path) {
      history.pushState({}, '', path);
      route();
    }

    document.addEventListener('click', function (e) {
      const a = e.target.closest('a[data-nav]');
      if (!a) return;
      e.preventDefault();
      navigate(a.getAttribute('href'));
    });
    window.addEventListener('popstate', route);

    function route() {
      const m = location.pathname.match(/^\/event\/(\d+)\/?$/);
      window.scrollTo(0, 0);
      if (location.pathname === '/new') renderNew();
      else if (m) renderDetail(Number(m[1]));
      else renderList();
    }

    // ------------------------------------------------------------------
    // Event list
    // ------------------------------------------------------------------
    let filter = 'upcoming';

    async function renderList() {
      appEl.innerHTML =
        '<div class="flex items-center justify-between gap-3 mb-5">' +
        '  <h1 class="text-2xl font-bold">Event Board</h1>' +
        '  <a data-nav href="/new" class="shrink-0 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold px-4 py-2.5 shadow-sm transition active:scale-95">New event</a>' +
        '</div>' +
        '<div class="flex rounded-xl bg-zinc-200/70 dark:bg-zinc-900 p-1 mb-4 text-sm font-medium" role="tablist" aria-label="Filter events">' +
        '  <button data-filter="upcoming" class="flex-1 rounded-lg py-1.5 transition">Upcoming</button>' +
        '  <button data-filter="past" class="flex-1 rounded-lg py-1.5 transition">Past</button>' +
        '</div>' +
        '<div id="event-list" class="flex flex-col gap-3"><p class="text-sm text-zinc-500 dark:text-zinc-400 px-1 py-6 text-center">Loading events…</p></div>';

      const buttons = appEl.querySelectorAll('[data-filter]');
      buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          filter = b.getAttribute('data-filter');
          paintFilter(buttons);
          loadEvents();
        });
      });
      paintFilter(buttons);
      await loadEvents();
    }

    function paintFilter(buttons) {
      buttons.forEach(function (b) {
        const on = b.getAttribute('data-filter') === filter;
        b.className = 'flex-1 rounded-lg py-1.5 transition ' + (on
          ? 'bg-white dark:bg-zinc-800 shadow-sm text-zinc-900 dark:text-zinc-100'
          : 'text-zinc-500 dark:text-zinc-400');
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    async function loadEvents() {
      const list = document.getElementById('event-list');
      if (!list) return;
      try {
        const { events } = await api('/api/events?filter=' + filter);
        if (!list.isConnected) return; // view changed mid-flight
        if (!events.length) {
          list.innerHTML = filter === 'upcoming'
            ? '<div class="rounded-2xl bg-white dark:bg-zinc-900 shadow-sm border border-zinc-200 dark:border-zinc-800 p-8 text-center">' +
              '  <p class="text-sm text-zinc-500 dark:text-zinc-400">No upcoming events yet.</p>' +
              '  <a data-nav href="/new" class="mt-4 inline-block rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold px-4 py-2.5 shadow-sm transition active:scale-95">Plan the first one</a>' +
              '</div>'
            : '<p class="text-sm text-zinc-500 dark:text-zinc-400 px-1 py-6 text-center">No past events.</p>';
          return;
        }
        list.innerHTML = events.map(eventCard).join('');
      } catch (err) {
        if (!list.isConnected) return;
        list.innerHTML =
          '<div class="rounded-2xl bg-white dark:bg-zinc-900 shadow-sm border border-zinc-200 dark:border-zinc-800 p-6 text-center">' +
          '  <p class="text-sm text-zinc-700 dark:text-zinc-300">Could not load events. ' + esc(err.message) + '</p>' +
          '  <button id="retry-events" class="mt-4 rounded-xl border border-zinc-300 dark:border-zinc-700 px-4 py-2 text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition">Try again</button>' +
          '</div>';
        document.getElementById('retry-events').addEventListener('click', loadEvents);
      }
    }

    function eventCard(e) {
      return '<a data-nav href="/event/' + e.id + '" class="block ' + CARD + ' p-4 transition active:scale-[0.99]">' +
        '<div class="flex items-start justify-between gap-3">' +
        '  <div class="min-w-0">' +
        '    <h3 class="font-semibold leading-snug break-words">' + esc(e.title) + '</h3>' +
        '    <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1.5">' + esc(fmtDate(e.starts_at)) + ' · ' + esc(fmtTime(e.starts_at)) + '</p>' +
        '    <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-0.5 break-words">' + esc(e.location) + '</p>' +
        (e.is_going
          ? '<p class="text-xs font-semibold text-violet-600 dark:text-violet-300 mt-2">You are going</p>'
          : '') +
        '  </div>' +
        '  <span class="' + GOING_PILL + ' shrink-0 text-xs font-semibold px-2.5 py-1">' + e.going_count + ' going</span>' +
        '</div>' +
        '</a>';
    }

    // ------------------------------------------------------------------
    // Event detail: Going toggle, attendee list, reminder note
    // ------------------------------------------------------------------
    async function renderDetail(id) {
      appEl.innerHTML =
        '<a data-nav href="/" class="inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-300 mb-4" aria-label="Back to events">' +
        '  <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.7 4.3a1 1 0 0 1 0 1.4L8.4 10l4.3 4.3a1 1 0 0 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>' +
        '  Events</a>' +
        '<p class="text-sm text-zinc-500 dark:text-zinc-400 px-1 py-6 text-center">Loading event…</p>';
      let data;
      try {
        data = await api('/api/events/' + id);
      } catch (err) {
        appEl.innerHTML =
          '<a data-nav href="/" class="inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-300 mb-4">Back to events</a>' +
          '<div class="' + CARD + ' p-6 text-center">' +
          '  <p class="text-sm text-zinc-700 dark:text-zinc-300">' + esc(err.message) + '</p>' +
          '</div>';
        return;
      }
      paintDetail(data);
    }

    function paintDetail(data) {
      const e = data.event;
      const going = data.is_going;
      appEl.innerHTML =
        '<a data-nav href="/" class="inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-300 mb-4" aria-label="Back to events">' +
        '  <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.7 4.3a1 1 0 0 1 0 1.4L8.4 10l4.3 4.3a1 1 0 0 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>' +
        '  Events</a>' +
        '<h1 class="text-2xl font-bold leading-snug break-words">' + esc(e.title) + '</h1>' +
        '<div class="' + CARD + ' p-5 mt-4">' +
        '  <p class="text-sm text-zinc-500 dark:text-zinc-400">When</p>' +
        '  <p class="font-medium">' + esc(fmtDate(e.starts_at)) + ' · ' + esc(fmtTime(e.starts_at)) + '</p>' +
        '  <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-3">Where</p>' +
        '  <p class="font-medium break-words">' + esc(e.location) + '</p>' +
        '</div>' +
        '<button id="going-btn" aria-pressed="' + (going ? 'true' : 'false') + '" class="w-full mt-4 rounded-2xl py-3.5 font-semibold transition active:scale-[0.98] ' +
        (going
          ? 'bg-violet-100 dark:bg-violet-600/20 text-violet-700 dark:text-violet-300 border border-violet-300 dark:border-violet-500/40'
          : 'bg-violet-600 hover:bg-violet-500 text-white shadow-sm') +
        '">' + (going ? "You're going" : "I'm going") + '</button>' +
        '<p class="text-xs text-zinc-500 dark:text-zinc-400 text-center mt-2 px-4">One Going per person. Tap again to cancel.</p>' +
        '<section class="mt-6">' +
        '  <h2 class="text-sm font-medium text-zinc-500 dark:text-zinc-400 mb-2 px-1">Going (<span id="going-count">' + data.attendees.length + '</span>)</h2>' +
        '  <div id="attendee-list" class="' + CARD + ' divide-y divide-zinc-100 dark:divide-zinc-800">' + attendeeRows(data.attendees) + '</div>' +
        '</section>' +
        '<div class="mt-6 rounded-2xl border border-amber-200 dark:border-amber-500/30 bg-amber-50 dark:bg-amber-500/10 p-4">' +
        '  <p class="text-sm font-semibold text-amber-800 dark:text-amber-300">Reminder</p>' +
        '  <p class="text-sm text-amber-700 dark:text-amber-200/80 mt-1">This event starts ' + esc(fmtDate(e.starts_at)) + ' at ' + esc(fmtTime(e.starts_at)) + '. Set a phone reminder so you do not miss it.</p>' +
        '</div>';

      document.getElementById('going-btn').addEventListener('click', function () { toggleGoing(data.event.id); });
    }

    function attendeeRows(attendees) {
      if (!attendees.length) {
        return '<p class="text-sm text-zinc-500 dark:text-zinc-400 p-4">Nobody is going yet. Be the first.</p>';
      }
      return attendees.map(function (a) {
        const initial = (a.username || '?').charAt(0).toUpperCase();
        return '<div class="flex items-center gap-3 p-3">' +
          '<span class="w-8 h-8 rounded-full bg-violet-600/15 text-violet-700 dark:text-violet-300 flex items-center justify-center text-sm font-bold">' + esc(initial) + '</span>' +
          '<span class="text-sm font-medium break-words">' + esc(a.username) + (a.mine ? ' <span class="text-zinc-400 dark:text-zinc-500 font-normal">(you)</span>' : '') + '</span>' +
          '</div>';
      }).join('');
    }

    async function toggleGoing(id) {
      const btn = document.getElementById('going-btn');
      btn.disabled = true;
      btn.classList.add('opacity-60');
      try {
        const data = await api('/api/events/' + id + '/going', { method: 'POST' });
        // Repaint the button, count and attendee list in place; the rest of
        // the view (and scroll position) stays untouched.
        const going = data.going;
        btn.disabled = false;
        btn.classList.remove('opacity-60');
        btn.setAttribute('aria-pressed', going ? 'true' : 'false');
        btn.className = 'w-full mt-4 rounded-2xl py-3.5 font-semibold transition active:scale-[0.98] ' +
          (going
            ? 'bg-violet-100 dark:bg-violet-600/20 text-violet-700 dark:text-violet-300 border border-violet-300 dark:border-violet-500/40'
            : 'bg-violet-600 hover:bg-violet-500 text-white shadow-sm');
        btn.textContent = going ? "You're going" : "I'm going";
        document.getElementById('going-count').textContent = data.going_count;
        document.getElementById('attendee-list').innerHTML = attendeeRows(data.attendees);
      } catch (err) {
        btn.disabled = false;
        btn.classList.remove('opacity-60');
        btn.textContent = err.message;
      }
    }

    // ------------------------------------------------------------------
    // Create event
    // ------------------------------------------------------------------
    const FIELD = 'mt-1.5 w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-violet-500';
    const LABEL = 'text-sm font-medium text-zinc-500 dark:text-zinc-400';

    function renderNew() {
      appEl.innerHTML =
        '<a data-nav href="/" class="inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-300 mb-4" aria-label="Back to events">' +
        '  <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.7 4.3a1 1 0 0 1 0 1.4L8.4 10l4.3 4.3a1 1 0 0 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>' +
        '  Events</a>' +
        '<h1 class="text-2xl font-bold">New event</h1>' +
        '<form id="event-form" class="' + CARD + ' p-5 mt-4 flex flex-col gap-4" novalidate>' +
        '  <label class="block">' +
        '    <span class="' + LABEL + '">Title</span>' +
        '    <input id="event-title" name="title" type="text" maxlength="200" placeholder="e.g. Saturday soccer" class="' + FIELD + '">' +
        '  </label>' +
        '  <label class="block">' +
        '    <span class="' + LABEL + '">When</span>' +
        '    <input id="event-when" name="when" type="datetime-local" class="' + FIELD + '">' +
        '  </label>' +
        '  <label class="block">' +
        '    <span class="' + LABEL + '">Where</span>' +
        '    <input id="event-where" name="where" type="text" maxlength="200" placeholder="e.g. Community park" class="' + FIELD + '">' +
        '  </label>' +
        '  <p id="form-error" class="hidden text-sm text-red-600 dark:text-red-400"></p>' +
        '  <button type="submit" class="rounded-2xl bg-violet-600 hover:bg-violet-500 text-white py-3.5 font-semibold shadow-sm transition active:scale-[0.98]">Create event</button>' +
        '</form>';

      document.getElementById('event-form').addEventListener('submit', createEvent);
    }

    async function createEvent(ev) {
      ev.preventDefault();
      const title = document.getElementById('event-title').value.trim();
      const whenRaw = document.getElementById('event-when').value;
      const where = document.getElementById('event-where').value.trim();
      const errEl = document.getElementById('form-error');
      const when = whenRaw ? new Date(whenRaw) : null;

      let message = '';
      if (title.length < 3) message = 'Title needs at least 3 characters.';
      else if (!when || isNaN(when.getTime())) message = 'Pick a date and time.';
      else if (!where.length) message = 'Add a location.';
      if (message) {
        errEl.textContent = message;
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');

      try {
        const { id } = await api('/api/events', {
          method: 'POST',
          body: JSON.stringify({ title: title, starts_at: when.toISOString(), location: where }),
        });
        navigate('/event/' + id);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    route();
  </script>
</body>
</html>
